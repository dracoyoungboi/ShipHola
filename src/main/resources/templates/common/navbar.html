<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<nav th:fragment="navbar(role)" class="navbar">
    <div class="navbar-container">
        <div class="navbar-brand">
            <a th:href="@{/}" class="logo">
                <span class="logo-icon">🚚</span>
                <span class="logo-text">ShipHola</span>
            </a>
        </div>

        <div class="navbar-menu">
            <ul class="navbar-nav">
                <li th:if="${role == 'ADMIN'}">
                    <a th:href="@{/admin/dashboard}">Dashboard</a>
                </li>
                <li th:if="${role == 'ADMIN'}">
                    <a th:href="@{/admin/packages}">Đơn hàng</a>
                </li>
                <li th:if="${role == 'ADMIN'}">
                    <a th:href="@{/admin/users}">Người dùng</a>
                </li>
                <li th:if="${role == 'ADMIN'}">
                    <a th:href="@{/admin/subscriptions}">Gói dịch vụ</a>
                </li>

                <li th:if="${role == 'DISPATCHER'}">
                    <a th:href="@{/dispatcher/dashboard}">Dashboard</a>
                </li>
                <li th:if="${role == 'DISPATCHER'}">
                    <a th:href="@{/dispatcher/packages/pending}">Đơn chờ xử lý</a>
                </li>
                <li th:if="${role == 'DISPATCHER'}">
                    <a th:href="@{/dispatcher/packages/assigned}">Đơn đã giao</a>
                </li>

                <li th:if="${role == 'SHIPPER'}">
                    <a th:href="@{/shipper/dashboard}">Dashboard</a>
                </li>
                <li th:if="${role == 'SHIPPER'}">
                    <a th:href="@{/shipper/packages}">Đơn của tôi</a>
                </li>
            </ul>
        </div>

        <div class="navbar-user">
            <span class="user-name" th:text="${#authentication.name}">User</span>
            <a th:href="@{/auth/logout}" class="btn-logout">Đăng xuất</a>
        </div>
    </div>
</nav>
</html>
